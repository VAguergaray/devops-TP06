services:

  db:
    image: postgres:16-alpine

    container_name: notes-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  backend:
    build:
      context: ./backend
      target: final

    container_name: notes-backend

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: notesdb
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "5000"

    networks:
      - app-network

  frontend:
    build:
      context: ./frontend

    container_name: notes-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
