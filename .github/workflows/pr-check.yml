# ============================================
# pr-check.yml — Checks rápidos en Pull Requests
# ============================================

name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements.txt

      - run: |
          cd backend
          pytest tests/ -v

      - run: docker compose config --quiet
