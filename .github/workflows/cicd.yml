# ============================================
# cicd.yml - Pipeline completo CI/CD
# TP07 - Plan DevOps
# ============================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - main            # pipeline completo
      - develop         # lint + test + build/push (sin deploy)
      - 'feature/**'    # solo lint + test
  pull_request:
    branches:
      - main
      - develop

env:
  DOCKER_IMAGE: valennzarat/devops-portfolio
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias de lint
        run: pip install flake8 yamllint

      - name: Lint Python (flake8)
        run: |
          flake8 backend/ \
            --max-line-length=100 \
            --exclude=tests \
            --count --statistics

      - name: Lint YAML (yamllint)
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" \
            docker-compose.yml \
            .github/workflows/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Correr tests con cobertura
        run: |
          cd backend
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  build-push:
    name: Build y Push imagen
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # Tags: nombre de rama, sha corto y "latest" solo en main
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          # target: final   # descomentar SOLO si tu Dockerfile tiene un stage "AS final"
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen del build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production   # aprobacion manual si se configura en Settings > Environments
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/devops-portfolio
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deploy completado: $(date)"

      - name: Healthcheck post-deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "http://${DEPLOY_HOST}/health" || echo "000")
            echo "Intento $i - HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deploy exitoso"
              exit 0
            fi
            sleep 10
          done
          echo "Deploy fallo"
          exit 1
